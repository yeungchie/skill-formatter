[project]
name = "skfmt"
dynamic = ["version"]
description = "A conservative formatter for Cadence SKILL source."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "YEUNGCHIE" }]
dependencies = []

[project.optional-dependencies]
# Presentation only. Plain "skfmt" stays zero-dependency; "skfmt[full]"
# enables pretty help and TOML highlighting.
full = ["rich>=13.9", "rich-argparse>=1.7"]

[project.scripts]
skfmt = "skfmt.cli:main"

[project.urls]
Homepage = "https://github.com/yeungchie/skill-formatter"
Repository = "https://github.com/yeungchie/skill-formatter"
Issues = "https://github.com/yeungchie/skill-formatter/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "ty>=0.0.1a1",
    "rich>=13.9",
    "rich-argparse>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skfmt"]

[tool.hatch.version]
path = "src/skfmt/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.12"
